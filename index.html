<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DERMAFiX Product Manual</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- Logo -->
    <img src="logo.png" class="logo" alt="DERMAFiX Logo">

    <!-- Title -->
    <h1>Official Product Manual</h1>

    <!-- Description -->
    <p class="sub">
        Choose your preferred language to view<br>
        the official DERMAFiX product manual.
    </p>

    <!-- Language Cards -->
    <div class="cards">

        <!-- Korean -->
        <a href="korea.pdf" class="card" target="_blank">

            <span class="flag">🇰🇷</span>

            <div class="info">
                <strong>한국어</strong>
            </div>

            <span class="badge" id="ko-badge">
                Recommended
            </span>

            <span class="arrow">›</span>

        </a>

        <!-- English -->
        <a href="eng.pdf" class="card" target="_blank">

            <span class="flag">🇺🇸</span>

            <div class="info">
                <strong>English</strong>
            </div>

            <span class="badge" id="en-badge">
                Recommended
            </span>

            <span class="arrow">›</span>

        </a>

        <!-- Japanese -->
        <a href="japan.pdf" class="card" target="_blank">

            <span class="flag">🇯🇵</span>

            <div class="info">
                <strong>日本語</strong>
            </div>

            <span class="badge" id="ja-badge">
                Recommended
            </span>

            <span class="arrow">›</span>

        </a>

        <!-- Chinese -->
        <a href="china.pdf" class="card" target="_blank">

            <span class="flag">🇨🇳</span>

            <div class="info">
                <strong>中文</strong>
            </div>

            <span class="badge" id="zh-badge">
                Recommended
            </span>

            <span class="arrow">›</span>

        </a>

    </div>

    <footer>
        © DERMAFiX. All rights reserved.
    </footer>

</div>

<script src="script.js"></script>

</body>

</html>
