<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DERMAFiX Product Guide</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- Logo -->
    <img src="logo.png" class="logo" alt="DERMAFiX Logo">

    <!-- Title -->
    <h1>Official Product Manual</h1>

    <p class="sub">
        Choose your preferred language to view<br>
        the official DERMAFiX product manual.
    </p>

    <!-- Language -->
    <div class="cards">

        <a href="korea.pdf" class="card" target="_blank">

            <span class="flag">🇰🇷</span>

            <div class="info">
                <strong>한국어</strong>
                <small>Korean</small>
            </div>

            <span class="badge" id="ko-badge">
                Recommended
            </span>

            <span class="arrow">→</span>

        </a>

        <a href="eng.pdf" class="card" target="_blank">

            <span class="flag">🇺🇸</span>

            <div class="info">
                <strong>English</strong>
                <small>English</small>
            </div>

            <span class="badge" id="en-badge">
                Recommended
            </span>

            <span class="arrow">→</span>

        </a>

        <a href="japan.pdf" class="card" target="_blank">

            <span class="flag">🇯🇵</span>

            <div class="info">
                <strong>日本語</strong>
                <small>Japanese</small>
            </div>

            <span class="badge" id="ja-badge">
                Recommended
            </span>

            <span class="arrow">→</span>

        </a>

        <a href="china.pdf" class="card" target="_blank">

            <span class="flag">🇨🇳</span>

            <div class="info">
                <strong>中文</strong>
                <small>Chinese</small>
            </div>

            <span class="badge" id="zh-badge">
                Recommended
            </span>

            <span class="arrow">→</span>

        </a>

    </div>

    <!-- Product Showcase -->

    <section class="product-section">

        <div class="stage">

            <!-- decorative -->
            <div class="glass-ball"></div>
            <img src="ampoule.png" class="glass-ampoule" alt="ampoule">

            <div class="platform">

                <div class="products">

                    <img src="toner.png" class="p-toner">

                    <img src="serum.png" class="p-serum">

                    <img src="cream-device.png" class="p-device">

                    <img src="poster.png" class="p-poster">

                </div>

            </div>

        </div>

    </section>

    <footer>

        © DERMAFiX. All rights reserved.

    </footer>

</div>

<script src="script.js"></script>

</body>

</html>
