<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DERMAFiX Product Manual</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Logo -->
    <img src="logo.png" class="logo" alt="DERMAFiX">

    <!-- Title -->
    <h1>Official Product Manual</h1>

    <p class="sub">
        Choose your preferred language to view<br>
        the official DERMAFiX product manual.
    </p>

    <!-- Language -->

    <div class="cards">

        <a href="korea.pdf" class="card" target="_blank">

            <span class="flag">🇰🇷</span>

            <div class="info">
                <strong>한국어</strong>
                <small>Korean</small>
            </div>

            <span class="badge" id="ko-badge">Recommended</span>

            <span class="arrow">→</span>

        </a>

        <a href="eng.pdf" class="card" target="_blank">

            <span class="flag">🇺🇸</span>

            <div class="info">
                <strong>English</strong>
                <small>English</small>
            </div>

            <span class="badge" id="en-badge">Recommended</span>

            <span class="arrow">→</span>

        </a>

        <a href="japan.pdf" class="card" target="_blank">

            <span class="flag">🇯🇵</span>

            <div class="info">
                <strong>日本語</strong>
                <small>Japanese</small>
            </div>

            <span class="badge" id="ja-badge">Recommended</span>

            <span class="arrow">→</span>

        </a>

        <a href="china.pdf" class="card" target="_blank">

            <span class="flag">🇨🇳</span>

            <div class="info">
                <strong>中文</strong>
                <small>Chinese</small>
            </div>

            <span class="badge" id="zh-badge">Recommended</span>

            <span class="arrow">→</span>

        </a>

    </div>

    <!-- Product Area -->

    <section class="product-section">

        <div class="stage">

            <!-- Decoration -->
            <div class="glass-ball"></div>

            <img src="ampoule.png"
                 class="glass-ampoule"
                 alt="Ampoule">

            <!-- Platform -->

            <div class="platform">

                <div class="products">

                    <!-- Toner -->
                    <img src="toner.png"
                         class="p-toner"
                         alt="Real Collagen Toner">

                    <!-- Serum -->
                    <img src="serum.png"
                         class="p-serum"
                         alt="Real Collagen Serum">

                    <!-- Cream + Device -->
                    <img src="cream-device.png"
                         class="p-device"
                         alt="Real Collagen Cream">

                    <!-- Poster -->
                    <img src="poster.png"
                         class="p-poster"
                         alt="Real Collagen Poster">

                </div>

            </div>

        </div>

    </section>

    <footer>
        © DERMAFiX. All rights reserved.
    </footer>

</div>

<script src="script.js"></script>

</body>

</html>
